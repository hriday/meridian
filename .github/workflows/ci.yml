name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # Only the root `main` package links Wails/GUI system libraries, which
      # aren't installed on bare runners. All engine/CLI logic lives under
      # internal/ and cmd/, so CI vets and tests those. The GUI build is run
      # locally (and later via a packaging workflow), not here.
      - run: go vet ./internal/...
      - run: go test ./internal/...

  # The Svelte UI isn't exercised by the Go job, so a render-time bug (a bad
  # template or a ReferenceError that blanks the app) can ship unseen. This job
  # builds the frontend and drives every tool in a headless browser with the
  # Wails bridge stubbed.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
