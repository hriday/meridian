name: Release

on:
  push:
    tags: ["v*"]
    branches: ["packaging"] # pre-merge pipeline verification (no release is cut)
  workflow_dispatch: {}

# Least privilege: the build jobs run third-party code (npm/go deps) and get
# read only; the release job elevates to write for itself.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -ldflags "-X github.com/hriday/meridian/internal/version.Version=${VERSION}"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-X github.com/hriday/meridian/internal/version.Version=${VERSION}"

      - name: Bundle meridian-cli into the .app
        if: runner.os == 'macOS'
        run: |
          # Ship the command-line tool inside the bundle so the GUI can symlink
          # it onto PATH (App.InstallCLI). It rides along in the DMG below.
          go build -ldflags "-X github.com/hriday/meridian/internal/version.Version=${VERSION}" \
            -o build/bin/meridian.app/Contents/MacOS/meridian-cli ./cmd/meridian-cli

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          # Stage the app next to an /Applications symlink so the DMG opens with
          # the familiar drag-the-app-onto-Applications layout.
          rm -rf dmg-staging
          mkdir -p dmg-staging
          cp -R build/bin/meridian.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Meridian" -srcfolder dmg-staging \
            -ov -format UDZO "dist/Meridian-${VERSION}-macos-universal.dmg"

      - name: Package Windows exe
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp build/bin/meridian.exe "dist/Meridian-${VERSION}-windows-amd64.exe"

      - name: Build meridian-cli (Linux)
        if: runner.os == 'Linux'
        run: |
          # Built beside the GUI binary so the AppImage bundles it; the app's
          # "Install command-line tool" action copies it onto the user's PATH.
          go build -ldflags "-X github.com/hriday/meridian/internal/version.Version=${VERSION}" \
            -o build/bin/meridian-cli ./cmd/meridian-cli

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash build/appimage/build-appimage.sh "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # only this job publishes the Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

  # Bump the Homebrew cask (version + DMG sha256) on master after a release, so
  # `brew install --cask meridian` always tracks the latest tag.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master

      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meridian-macOS
          path: dist

      - name: Bump cask
        run: |
          VER="${GITHUB_REF_NAME#v}"
          DMG="dist/Meridian-${GITHUB_REF_NAME}-macos-universal.dmg"
          [ -f "$DMG" ] || { echo "no DMG at $DMG" >&2; exit 1; }
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          sed -i -E "s|^  version \".*\"|  version \"${VER}\"|" Casks/meridian.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/meridian.rb

      # master is a protected branch (changes must go through a PR), so the bot
      # can't push the bump directly. Open a short-lived branch, raise a PR, and
      # squash-merge it (0 required reviews, no required checks → mergeable at once).
      - name: Open and merge the cask bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Casks/meridian.rb; then
            echo "cask already current for ${GITHUB_REF_NAME}"; exit 0
          fi
          BRANCH="homebrew-bump-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Casks/meridian.rb
          git commit -m "chore(homebrew): meridian ${GITHUB_REF_NAME}"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "chore(homebrew): meridian ${GITHUB_REF_NAME}" \
            --body "Automated Homebrew cask bump for ${GITHUB_REF_NAME} (release job already published the DMG)."
          for i in $(seq 1 10); do
            if gh pr merge "$BRANCH" --squash --delete-branch \
                 --subject "chore(homebrew): meridian ${GITHUB_REF_NAME} [skip ci]"; then
              exit 0
            fi
            echo "PR not mergeable yet, retrying in 6s…"; sleep 6
          done
          echo "could not auto-merge the cask bump PR for ${GITHUB_REF_NAME}" >&2
          exit 1
