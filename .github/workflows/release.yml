name: Release

on:
  push:
    tags: ["v*"]
    branches: ["packaging"] # pre-merge pipeline verification (no release is cut)
  workflow_dispatch: {}

# Least privilege: the build jobs run third-party code (npm/go deps) and get
# read only; the release job elevates to write for itself.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          hdiutil create -volname "Meridian" -srcfolder build/bin/meridian.app \
            -ov -format UDZO "dist/Meridian-${VERSION}-macos-universal.dmg"

      - name: Package Windows exe
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp build/bin/meridian.exe "dist/Meridian-${VERSION}-windows-amd64.exe"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash build/appimage/build-appimage.sh "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # only this job publishes the Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
