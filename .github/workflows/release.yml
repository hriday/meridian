name: Release

on:
  push:
    tags: ["v*"]
    branches: ["packaging"] # pre-merge pipeline verification (no release is cut)
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          hdiutil create -volname "Meridian" -srcfolder build/bin/meridian.app \
            -ov -format UDZO "dist/Meridian-${VERSION}-macos-universal.dmg"

      - name: Package Windows exe
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp build/bin/meridian.exe "dist/Meridian-${VERSION}-windows-amd64.exe"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash build/appimage/build-appimage.sh "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
